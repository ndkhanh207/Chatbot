# Search / Specification
product_not_found: >
  Hiện cửa hàng chưa tìm thấy sản phẩm phù hợp với yêu cầu “{query}”.

missing_product_name: >
  Bạn cho mình biết tên hoặc mã sản phẩm cần kiểm tra nhé.

search_header: >
  Dạ em tìm thấy các sản phẩm sau:

specification_fallback: >
  Dạ đây là thông tin kỹ thuật của {name}. Do lỗi kết nối, em chỉ có thể cung cấp nguyên mẫu hệ thống: {facts}

specification_detail_unavailable: >
  Dạ, catalog hiện chưa đủ dữ liệu về {detail} của {name} để trả lời chính xác ạ.


# Suggestion
missing_origin_component: >
  Dạ em chưa rõ anh/chị đang muốn nâng cấp linh kiện nào. Vui lòng cung cấp chính xác 1 linh kiện gốc (VD: 'Tôi đang có main H610, tư vấn giúp tôi CPU') ạ.

no_compatible_suggestions: >
  Dạ em không tìm thấy sản phẩm '{have_name}' trong kho nên chưa thể gợi ý linh kiện tương thích chính xác được ạ.

suggestion_header: >
  Dạ đây là một số linh kiện tương thích mà em tìm được ạ:

suggestion_not_supported: >
  Dạ hiện tại tính năng gợi ý tự động cho '{category}' chưa được hỗ trợ, em chỉ mới hỗ trợ ghép CPU, Mainboard và VGA thôi ạ.

# Price
missing_price_terms: >
  Dạ em không tìm thấy thông tin cho: {terms} ạ.

price_check_fallback: >
  Dạ, giá của {name} hiện tại là {price_formatted} VNĐ ạ.

price_calculation_fallback: >
  Dạ, tổng giá tiền của các sản phẩm là {total_formatted} VNĐ ạ.

# PC Builder Clarification
missing_budget: >
  Dạ để tư vấn cấu hình phù hợp nhất, bạn có thể cho mình biết ngân sách dự kiến của bạn khoảng bao nhiêu được không ạ?

missing_purpose: >
  Dạ để tối ưu cấu hình nhất, bạn có thể chia sẻ thêm chi tiết mục đích sử dụng chính của máy (ví dụ: chơi game cụ thể nào, phần mềm làm việc nào) không ạ?

budget_scope_ambiguous: >
  Dạ bạn muốn ngân sách {budget} VNĐ là cho tổng {qty} máy hay cho mỗi máy ạ?

component_not_found: >
  Dạ em không tìm thấy linh kiện "{name}" trong kho. Bạn kiểm tra lại tên giúp em nhé.

components_incompatible: >
  Dạ các linh kiện bạn chọn không tương thích với nhau. Bạn có muốn em gợi ý linh kiện thay thế không ạ?

merge_error: >
  Dạ em gặp lỗi khi xử lý yêu cầu cập nhật cấu hình. Bạn thử lại giúp em nhé.

missing_selected_build: >
  Dạ hiện chưa có cấu hình nào được chọn. Bạn muốn em tư vấn một bộ PC mới không ạ?

build_not_found: >
  Dạ em không tìm thấy bộ máy đã chọn trước đó trong hệ thống. Bạn muốn em tìm bộ mới không ạ?

no_candidate_build: >
  Dạ em không tìm thấy cấu hình nào phù hợp với yêu cầu của bạn. Bạn thử điều chỉnh ngân sách hoặc nhu cầu giúp em nhé.

# Compatibility
compatibility_missing_info: >
  Dạ thông tin linh kiện anh/chị cung cấp chưa đủ rõ ràng hoặc không có trong kho. Xin vui lòng cung cấp đúng tên linh kiện để em kiểm tra tương thích ạ.

compatibility_fallback: >
  Dạ hệ thống đang bận. Trạng thái tương thích tổng thể: {overall}. (Chi tiết: {details})

# Input Guard
input_too_long: >
  Tin nhắn của bạn quá dài, bạn có thể tóm tắt lại giúp mình được không?

empty_input: >
  Dạ bạn cần hỏi gì ạ?

invalid_format: >
  Định dạng tin nhắn không hợp lệ.

unsafe_content: >
  Xin lỗi, em không thể hỗ trợ nội dung này ạ.

out_of_scope: >
  Dạ em chỉ chuyên tư vấn linh kiện và cấu hình máy tính để bàn thôi ạ! Bạn có cần tư vấn CPU, GPU, hay build bộ PC không?

greeting: >
  Dạ em chào bạn! Em là trợ lý tư vấn máy tính, em có thể giúp gì cho bạn hôm nay ạ? 😊

unrecognized_intent: >
  Dạ em không hiểu câu hỏi này ạ! Bạn vui lòng nhập lại rõ hơn giúp em nhé 😊

# Infrastructure
routing_unavailable: >
  Hệ thống đang xử lý chậm nên chưa thể xác định yêu cầu của bạn. Bạn thử lại sau một chút nhé.

llm_unavailable: >
  Dạ hệ thống đang bận nên em chưa xử lý được. Bạn vui lòng thử lại sau một chút nhé.

catalog_unavailable: >
  Hệ thống hiện không thể kết nối tới kho hàng. Bạn thử lại sau nhé.

system_error: >
  Đã có lỗi hệ thống xảy ra. Mong bạn thông cảm và thử lại sau.
